<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="logo.png" alt="logo" width="100">
    <h1>Adote seu Cauchorro</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="sobre nós.html">sobre nós</a>
        <a href="nossos animais.html">animais</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main>

    <section class="contato">

        <h2>Entre em Contato</h2>

        <p>
            Estamos prontos para atender você! Se tiver dúvidas, precisar de
            informações ou desejar conhecer nossos animais disponíveis para adoção,
            entre em contato conosco.
        </p>

        <br>

        <form>

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" rows="5" placeholder="Digite sua mensagem" required></textarea>

            <button type="submit">Enviar</button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Adote seu Cauchorro</p>
</footer>

</body>
</html>
